{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Macro Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/app.css' %}">
    {% block extra_css %}{% endblock %}
    <script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script defer src="{% static 'dashboard/js/app.js' %}"></script>
    <script defer src="{% static 'dashboard/js/news.js' %}"></script>
    <script defer src="{% static 'dashboard/js/calendar.js' %}"></script>
    {% block extra_js %}{% endblock %}
</head>
<body>
<header class="topbar">
    <div>
        <a class="brand" href="{% url 'dashboard:index' %}">Macro Dashboard</a>
        <div class="brand-subtitle">Somente dados coletados das fontes configuradas</div>
    </div>
    <nav>
        <a href="{% url 'dashboard:index' %}">Dashboard</a>
        <a href="{% url 'dashboard:trade_diary' %}">Diário Trade</a>
        <a href="{% url 'dashboard:validation' %}">Validação</a>
        <a href="{% url 'dashboard:api_raw_snapshot' %}" target="_blank" rel="noopener">JSON bruto</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
